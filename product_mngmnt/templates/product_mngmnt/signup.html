                    <form method="post">
                      {% csrf_token %}
                        <div class="row">
                          <div class="col-md-6 mb-4">
                            <div class="form-outline">
                              <input type="text" id="form3Example1m" name="name" class="form-control form-control-lg" />
                              <label class="form-label" for="form3Example1m">Name</label>
                            </div>
                          </div>
                          <div class="col-md-6 mb-4">
                              <div class="form-outline">
                                <input type="tel" id="form3Example1m" name="mobileno" class="form-control form-control-lg" />
                                <label class="form-label" for="form3Example1m">Mobile No</label>
                              </div>
                            </div>

                            

                            <div class="col-md-12 mb-4">
                              <div class="form-outline">
                                <input type="email" id="form3Example1m" name="email" class="form-control form-control-lg" />
                                <label class="form-label" for="form3Example1m">Email</label>
                              </div>
                            </div>

                          </div>
                           {% endfor %}

                        <div class="d-flex justify-content-end align-items-center pt-3">
                          <button type="submit" class="btn btn-warning btn-lg ms-2">Signup</button>
                        </div>

                        <div class="d-flex justify-content-end pt-3">
                          <h5>Have an Account</h5><a href="{% url 'login' %}"><button type="button" class="btn btn-primary btn-lg ms-2">Login</button>
